<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NMIMS Lost & Found Portal</title>
  <meta name="description" content="Secure login portal for NMIMS Lost and Found System">
  <link rel="stylesheet" href="css/styles_login_register.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div id="heading">
    <div class="brand-badge">
      <i class="fa-solid fa-graduation-cap"></i> NMIMS HYDERABAD
    </div>
    <h1 class="montserrat-heading">LOST & FOUND PORTAL</h1>
  </div>
  
  <div class="container">
    <div class="form-container">
      <h1>Welcome Back</h1>
      <p class="form-subtitle">Enter your credentials to access your portal</p>
      <form id="login-form">
        <div class="input-group">
          <input type="email" id="email" name="email" placeholder="Campus Email Address" required>
          <i class="fa-regular fa-envelope"></i>
        </div>
        <div class="input-group">
          <input type="password" id="password" name="password" placeholder="Password" required>
          <i class="fa-solid fa-lock"></i>
        </div>
        <button type="submit" id="submit-btn">
          <span>Sign In</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
      <p>Don't have an account? <a href="register.html">Create one here</a></p>
      <p><a href="#" id="forgot-password"><i class="fa-solid fa-key"></i> Forgot your password?</a></p>
      <div class="loader" id="register-loader" style="display: none;"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/7.14.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.14.1/firebase-auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/login.js"></script>
</body>
</html>
